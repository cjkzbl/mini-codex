[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minicodex"
version = "0.5.4"
description = "Windows-first desktop coding agent with approved patch and command tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6==6.10.2", "httpx==0.28.1", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-qt==4.5.0",
  "ruff==0.14.14", "mypy==1.19.1", "pyinstaller==6.18.0",
]

[project.gui-scripts]
minicodex = "minicodex.frontend.desktop:main"

[tool.setuptools.packages.find]
include = ["minicodex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
markers = ["docker: opt-in real Docker Desktop/Linux-engine integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["minicodex"]
