name: Windows M4 verification
on: [push, pull_request, workflow_dispatch]
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
  package:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - shell: pwsh
        run: ./packaging/build_windows.ps1 -Python python -DistributionSubdir dist/0.5.5
      - shell: pwsh
        run: ./packaging/smoke_windows.ps1
      - run: python packaging/smoke_http.py
      - shell: pwsh
        run: ./packaging/smoke_m2.ps1 -ProjectPython (Get-Command python).Source
      - uses: actions/upload-artifact@v4
        with:
          name: MiniCodex-Windows-M4
          path: |
            dist/0.5.5/MiniCodex/
            artifacts/package-smoke.json
            artifacts/package-preview.png
            artifacts/package-http-smoke.json
            artifacts/m2-package-smoke.json
            artifacts/m2-package-preview.png
